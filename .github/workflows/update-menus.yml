name: Update lunch menus

on:
  schedule:
    # Weekdays, twice a day (UTC). Roughly 06:15-07:15 and 10:15-11:15 in Helsinki.
    - cron: "15 4 * * 1-5"
    - cron: "15 8 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - run: python scripts/fetch_menus.py
      - name: Commit changed menus
        run: |
          if [ -n "$(git status --porcelain docs/menus.json)" ]; then
            git config user.name "lunch-menu-bot"
            git config user.email "lunch-menu-bot@users.noreply.github.com"
            git add docs/menus.json
            git commit -m "Update menus"
            git push
          fi
